<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Events | Events</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="css/dashboard.css" />
    <link rel="stylesheet" href="css/events.css" />
  </head>
  <body>
    <!-- Icon sprite -->
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></symbol>
      <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M3 10h18M8 3v4M16 3v4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-ticket" viewBox="0 0 24 24"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 1 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M14 5v14" stroke="currentColor" stroke-width="1.8" stroke-dasharray="2 3"/></symbol>
      <symbol id="i-user" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M4 21a8 8 0 0 1 16 0" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M12 7v5l3 2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-pin" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-11.5A7 7 0 0 0 5 9.5C5 14.8 12 21 12 21z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/></symbol>
      <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M20 20l-4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
      <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
    </svg>

    <a class="skip-link" href="#main">Skip to content</a>

    <!-- Mobile top bar -->
    <header class="topbar">
      <button class="menu-toggle" id="menuToggle" type="button" aria-label="Open menu" aria-controls="sidebar" aria-expanded="false">
        <svg class="icon" aria-hidden="true"><use href="#i-menu" /></svg>
      </button>
      <span class="topbar-brand">CampusFlow</span>
    </header>
    <div class="backdrop" id="backdrop" hidden></div>

    <div class="app">
      <aside class="sidebar" id="sidebar">
        <p class="brand">CampusFlow</p>
        <nav aria-label="Main menu">
          <p class="nav-label">Main menu</p>
          <ul>
            <li><a href="dashboard.html"><svg class="icon" aria-hidden="true"><use href="#i-home" /></svg>Dashboard</a></li>
            <li><a href="events.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#i-calendar" /></svg>Events</a></li>
            <li><a href="registrations.html"><svg class="icon" aria-hidden="true"><use href="#i-ticket" /></svg>My Registrations</a></li>
            <li><a href="profile.html"><svg class="icon" aria-hidden="true"><use href="#i-user" /></svg>Profile</a></li>
          </ul>
        </nav>
      </aside>

      <main class="content" id="main" tabindex="-1">
        <section class="page-head" aria-labelledby="pageTitle">
          <h1 id="pageTitle">Events</h1>
          <p class="muted">Find something happening on campus and register.</p>
        </section>

        <p class="mock-note" role="note">Sample data: events and registrations below are placeholders saved only in this browser until the backend is connected.</p>

        <section class="toolbar" role="search" aria-label="Find events">
          <div class="field">
            <label for="eventSearch">Search events</label>
            <div class="search-wrap">
              <svg class="icon" aria-hidden="true"><use href="#i-search" /></svg>
              <input type="search" id="eventSearch" placeholder="Search by title, venue or topic" autocomplete="off" />
            </div>
          </div>
          <div class="chips" id="chips" role="group" aria-label="Filter by category">
            <button class="chip" type="button" data-category="all" aria-pressed="true">All</button>
            <button class="chip" type="button" data-category="technology" aria-pressed="false">Technology</button>
            <button class="chip" type="button" data-category="cultural" aria-pressed="false">Cultural</button>
            <button class="chip" type="button" data-category="careers" aria-pressed="false">Careers</button>
            <button class="chip" type="button" data-category="sports" aria-pressed="false">Sports</button>
          </div>
        </section>

        <p class="result-count" id="resultCount" role="status"></p>

        <section aria-label="Event list">
          <div class="event-grid" id="eventGrid" aria-busy="true"></div>
        </section>
      </main>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <script src="js/common.js"></script>
    <script src="js/nav.js"></script>
    <script src="js/events.js"></script>
  </body>
</html>
